<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policy Violation - Blocked</title>
    <style>
        body {
            background-color: #0078D7;
            color: #FFFFFF;
            /* Force thin look on Mac (SF Pro Light/Thin) to resemble Segoe UI Light */
            font-family: "Segoe UI Light", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            font-weight: 300;
            margin: 0;
            padding: 8% 12%;
            line-height: 1.4;
        }

        .emoticon-svg {
            width: 140px;
            height: 140px;
            margin-bottom: 2rem;
            display: block;
        }

        .message {
            font-size: 2rem;
            margin-bottom: 2.5rem;
            letter-spacing: 0.02em;
        }

        .progress {
            font-size: 1.5rem;
            margin-bottom: 3.5rem;
            letter-spacing: 0.02em;
        }

        .qr-section {
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .qr-placeholder {
            width: 105px;
            height: 105px;
            background-color: #0078D7;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .qr-placeholder img {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: auto;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        .info {
            font-size: 0.8rem;
            line-height: 1.6;
        }

        .support-code {
            font-family: Consolas, "Courier New", monospace;
            font-weight: normal;
        }
    </style>
</head>

<body>
    <!-- Authentic Segoe UI Light :( replica using SVG -->
    <svg class="emoticon-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <!-- Colon -->
        <circle cx="25" cy="35" r="4.5" fill="#fff" />
        <circle cx="25" cy="85" r="4.5" fill="#fff" />
        <!-- Parenthesis -->
        <path d="M 85 10 Q 50 60 85 110" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" />
    </svg>

    <div class="message">
        Your connection ran into a policy violation and needs to be blocked.

    <div class="progress">

                    alt="QR Code">

        <div class="info">
            For more information about this issue and possible fixes, contact<br>
            your system administrator.<br><br>
            If you call a support person, give them this info:<br>
            Stop code: <span class="support-code">KINTATE_ACCESS_DENIED</span>
        </div>
    </div>
</body>

</html>
